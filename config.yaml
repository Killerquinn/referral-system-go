server:
  port: 8080
  env: local # development, production, local
  name: referral-service
  read_timeout: 5s
  read_header_timeout: 5s
  idle_timeout: 5s
  write_timeout: 5s
  # CIDRs of reverse proxies allowed to set X-Forwarded-For (e.g. ["127.0.0.1/32"] for nginx on localhost).
  # Empty = no proxy, client IP comes from the TCP connection.
  trusted_proxies: []

postgres:
  dsn: "postgres://user:password@localhost:5432/referral_db?sslmode=disable"
  max_connections: 20
  min_connections: 5
  max_connection_lifetime: 1h
  max_connection_idle_time: 30m
  health_check_period: 10s

stripe:
  secret_key: "sk_test_..." 
  webhook_secret: "whsec_..."

jaeger:
  endpoint: "http://localhost:14268/api/traces"
  sampler: 1.0

jwt:
  ttl: 15m
  secret_key: "supersecret xD"

refresh:
  hmac_secret: "supersecret xD"
  refresh_ttl: 720h #30 days

options:
  baseurl: "http://myapp.com"
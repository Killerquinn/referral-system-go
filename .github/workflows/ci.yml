# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install libvips
      run: |
       sudo apt-get update
       sudo apt-get install -y libvips-dev


    - name: Test
      run: |
       go vet ./...
       go test ./...

    - name: Build
      run: go build -v ./...

    - name: Docker build
      run: docker build .
  
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
     - uses: actions/checkout@v5
     - name: Log in to GHCR
       uses: docker/login-action@v3
       with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

     - name: Build and Push
       run: |
          docker build \
            -t ghcr.io/killerquinn/referral-backend:${{ github.sha }} \
            -t ghcr.io/killerquinn/referral-backend:latest \
            --label org.opencontainers.image.source=https://github.com/Killerquinn/referral-system-go \
            .
          docker push ghcr.io/killerquinn/referral-backend:${{ github.sha }}
          docker push ghcr.io/killerquinn/referral-backend:latest
